name: Lint
on:
    pull_request:
        branches: ['**']
jobs:
    build:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v7
            - uses: oven-sh/setup-bun@v2.2.0
              with:
                  bun-version: '1.4.0'
            - run: bun install --frozen-lockfile
            - run: bun run build
            - run: bun run lint
